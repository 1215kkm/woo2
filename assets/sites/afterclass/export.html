<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>AFTER CLASS / Export</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f2}#canvas{overflow:hidden;line-height:0;width:max-content}iframe{border:0;display:block;transform-origin:top left}</style></head><body><main id="canvas" role="img" aria-label="고해상도 디자인 시안"><iframe id="frame" title="디자인 시안"></iframe></main><script>const p=new URLSearchParams(location.search),d=p.get('device')||'mobile',scale=Number(p.get('scale')||2),w=d==='board'?1800:d==='desktop'?1440:d==='presentation'?1440:393,h=Number(p.get('height')||(d==='board'?1220:d==='desktop'?1100:d==='presentation'?1080:852));const f=document.getElementById('frame');f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+scale+')';document.getElementById('canvas').style.width=w*scale+'px';document.getElementById('canvas').style.height=h*scale+'px';f.src=d==='board'?'board-v2.html': 'index.html?'+(d==='presentation'?'view=presentation':'screen='+(p.get('screen')||'home'))+'&frame=1&theme='+(p.get('theme')||'light')+(p.has('state')?'&state='+p.get('state'):'');</script></body></html>
