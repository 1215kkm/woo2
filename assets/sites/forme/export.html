<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>FORME — Design board</title><link rel="stylesheet" href="style.css"><style>body{padding:0}.presentation{padding:65px 70px;background:#e8e7df;min-width:1760px}.board-label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.15em}.presentation h1{font:normal 76px/1 Arial;letter-spacing:-5px;margin:30px 0 12px}.presentation>p{color:#777;margin-bottom:55px}.screens{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}.screens img{width:100%;height:auto}.screens figure{margin:0}.screens figcaption{display:flex;justify-content:space-between;margin-bottom:16px;font-size:11px}.screen-note{line-height:1.9;font-size:12px;margin-top:22px;max-width:320px}.end{display:flex;justify-content:space-between;border-top:1px solid #c9c8bf;margin-top:45px;padding-top:25px;font-size:10px}.accent{color:#ed502e}</style></head><body><main class="presentation"><div class="board-label"><span>FORME® / DIGITAL FLAGSHIP</span><span>DESIGN STUDY — AUTUMN 2026</span></div><h1>Quiet form. Everyday freedom.</h1><p>차분한 여백, 분명한 형태. 탐색부터 구매까지 이어지는 남성의류 웹 경험.</p><div class="screens"><figure><figcaption><span class="accent">01 / DISCOVER</span><span>HOME</span></figcaption><img src="exports/mobile-home-viewport.png" alt="모바일 홈"><p class="screen-note">모바일 전용 세로 구도와 큰 제목.<br>여백을 남겨 제품과 사람에 시선을 모읍니다.</p></figure><figure><figcaption><span class="accent">02 / EXPLORE</span><span>COLLECTION</span></figcaption><img src="exports/mobile-list-viewport.png" alt="모바일 목록"><p class="screen-note">간결한 필터, 두 열의 상품 구성.<br>저장과 비교가 익숙하게 이어집니다.</p></figure><figure><figcaption><span class="accent">03 / UNDERSTAND</span><span>PRODUCT</span></figcaption><img src="exports/mobile-detail-viewport.png" alt="모바일 상세"><p class="screen-note">오브제처럼 보여주는 제품, 또렷한 정보.<br>하단 구매 행동을 쉽게 찾을 수 있습니다.</p></figure><figure><figcaption><span class="accent">04 / CHOOSE</span><span>OPTIONS</span></figcaption><img src="exports/mobile-options-viewport.png" alt="모바일 옵션"><p class="screen-note">사이즈 선택과 수량, 실시간 금액.<br>선택의 결과를 바로 확인할 수 있습니다.</p></figure></div><div class="end"><span>PURE HTML / CSS / JAVASCRIPT — PC + MOBILE</span><span>393 × 852 / WARM WHITE · INK · VERMILION</span></div></main></body></html>
